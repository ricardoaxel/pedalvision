<svg xmlns="http://www.w3.org/2000/svg" width="800" height="417" viewBox="0 0 800 417">
  <title>Pedaltrain Classic 2 flat board</title>
  <defs>
    <mask id="boardMask">
      <rect width="800" height="417" fill="white"/>
      <rect x="34" y="67" width="732" height="50" rx="3" fill="black"/>
      <rect x="34" y="184" width="732" height="49" rx="3" fill="black"/>
      <rect x="34" y="300" width="732" height="50" rx="3" fill="black"/>
    </mask>
    <clipPath id="boardClip">
      <rect width="800" height="417" rx="4"/>
    </clipPath>
  </defs>
  <g clip-path="url(#boardClip)">
    <rect width="800" height="417" fill="#151515" mask="url(#boardMask)"/>
    <g fill="none" stroke="#333333" stroke-width="1">
      <rect x="34" y="67" width="732" height="50" rx="3"/>
      <rect x="34" y="184" width="732" height="49" rx="3"/>
      <rect x="34" y="300" width="732" height="50" rx="3"/>
      <rect x="0.5" y="0.5" width="799" height="416" rx="3.5"/>
    </g>
  </g>
</svg>
