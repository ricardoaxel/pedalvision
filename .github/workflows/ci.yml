name: CI

# Every push to main and every pull request runs the full pipeline:
#   lint -> typecheck -> unit tests -> build -> Playwright smoke (chromium).
# A failure at any step stops the job, so the deploy step below only runs
# when everything is green.
#
# Deploy target is Cloudflare Pages (see docs/decisions/002-hosting-and-assets.md):
#   - PRs -> preview deployment (URL posted as a PR comment)
#   - main -> production deployment
#
# Requires two GitHub Actions secrets (repo Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token scoped to Cloudflare Pages (Edit permission).
#                          Create in Cloudflare Dashboard > My Profile > API Tokens > Create Token.
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID (Dashboard > Workers & Pages > Overview, right sidebar).
# These values live ONLY in GitHub Secrets — never commit them.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright browsers cached keyed by the installed Playwright version,
      # so the cache is invalidated exactly when the runner version changes.
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E smoke (chromium)
        run: pnpm e2e

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pedalvision
          comment: true