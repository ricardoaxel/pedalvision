name: CI

# Every push to main and every pull request runs the full pipeline:
#   lint -> typecheck -> unit tests -> build -> Playwright e2e (chromium + mobile-chromium touch).
# A failure at any step stops the job, so the deploy step below only runs
# when everything is green.
#
# Deploy target is Cloudflare Pages (see docs/decisions/002-hosting-and-assets.md):
#   - PRs -> preview deployment (URL posted as a PR comment)
#   - main -> production deployment
#
# Requires two GitHub Actions secrets (repo Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflare API token scoped to Cloudflare Pages (Edit permission).
#                          Create in Cloudflare Dashboard > My Profile > API Tokens > Create Token.
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID (Dashboard > Workers & Pages > Overview, right sidebar).
# These values live ONLY in GitHub Secrets — never commit them.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright browsers cached keyed by the installed Playwright version,
      # so the cache is invalidated exactly when the runner version changes.
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Fetch PR base for catalog drift check
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Catalog drift check (non-batch PR)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} -- data/catalog/research public/pedal-assets; then
            pnpm catalog:check
          else
            echo "batch PR: mapped/runtime are generated by the post-merge build"
          fi

      - name: Catalog pipeline (temp build + validate + uncommitted runtime)
        run: pnpm catalog:ci

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E (chromium + mobile-chromium)
        run: pnpm e2e

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Self-bootstrap: create the Pages project on first deploy; skip if it
          # already exists (the `|| true` swallows the "already exists" error).
          preCommands: |
            wrangler pages project create pedalvision --production-branch main || true
          # Pass --branch explicitly: on PRs the checkout is a detached HEAD, so
          # wrangler can't infer the branch and the stable alias wouldn't be set.
          # head_ref = PR source branch; ref_name = branch on push (main).
          command: pages deploy dist --project-name=pedalvision --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Update preview link on PR (sticky, stable URL)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          # Prefer the stable branch alias (always points to the latest deploy for
          # this branch, so a link in the PR description never changes); fall back
          # to the immutable per-deploy URL if the alias isn't available yet.
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- pedalvision-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              '### Preview (latest commit)',
              '',
              `**${url}**`,
              '',
              '_Stable link for this branch — it updates automatically on every push, so no need to edit it._',
              '',
              'Production: https://pedalvision.pages.dev',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }